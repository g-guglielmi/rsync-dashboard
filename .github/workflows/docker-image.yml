# Builds the Docker image and publishes it to GitHub Container Registry (ghcr.io).
#
# - Push to main           -> rebuilds and publishes the `:latest` tag.
# - Push a tag like v1.2.0 -> ALSO publishes `:v1.2.0`, `:v1.2`, `:v1`, and
#   creates a GitHub Release with auto-generated notes (what changed since
#   the last tag).
#
# Nothing to configure: GITHUB_TOKEN is provided automatically by GitHub
# Actions with permission to publish packages and create releases in your
# own repo.
#
# Actions are pinned to commit SHAs (the tag in the comment is what they
# resolve to); Dependabot keeps them current.

name: Build and publish image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the workflow create a GitHub Release
      packages: write   # lets it publish to ghcr.io
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rsync-dashboard
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Build locally first and boot the image: catches "module not copied
      # into the image" style failures that unit tests can't see.
      - name: Build (local, for smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: rsync-dashboard:smoke

      - name: Smoke test the image
        env:
          PW: smoke-test-password-123
        run: |
          set -u
          # Simulate unRAID: a root-owned, non-world-writable host folder bound to the state dir.
          sudo mkdir -p /tmp/rsync-state && sudo chown root:root /tmp/rsync-state && sudo chmod 755 /tmp/rsync-state
          # Same hardened flags the unRAID template applies (ExtraParams).
          HARDEN="--cap-drop=ALL --cap-add=CHOWN --cap-add=FOWNER --cap-add=SETUID --cap-add=SETGID --security-opt=no-new-privileges"
          docker run -d --name smoke -p 8686:8686 $HARDEN -e SETTINGS_PASSWORD="$PW" \
            -v /tmp/rsync-state:/data/state rsync-dashboard:smoke
          ok=
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8686/healthz >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::Container did not become healthy"; docker logs smoke; exit 1
          fi
          B=http://127.0.0.1:8686
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          curl -fs $B/api/dashboard >/dev/null
          [ "$(code $B/api/settings)" = 401 ] || { echo "::error::settings without password should be 401"; exit 1; }
          [ "$(code -H "X-Settings-Password: wrong" $B/api/settings)" = 401 ] || { echo "::error::wrong password should be 401"; exit 1; }
          [ "$(code -H "X-Settings-Password: $PW" $B/api/settings)" = 200 ] || { echo "::error::right password should be 200"; docker logs smoke; exit 1; }
          [ "$(code $B/api/alerts/test)" = 405 ] || { echo "::error::GET on /api/alerts/test should be 405"; exit 1; }
          # Settings must be writable into the bind-mounted folder (the PUID/PGID chown must have worked)
          [ "$(code -X PUT -H "X-Settings-Password: $PW" -H 'Content-Type: application/json' -d '{"overdue_hours": 30}' $B/api/settings)" = 200 ] \
            || { echo "::error::Saving settings into the bind-mounted state dir failed"; docker logs smoke; exit 1; }
          sudo test -f /tmp/rsync-state/settings.json || { echo "::error::settings.json not written to host folder"; exit 1; }
          mode=$(sudo stat -c '%a %u' /tmp/rsync-state/settings.json); echo "settings.json: $mode"
          [ "$mode" = "600 99" ] || { echo "::error::settings.json should be mode 600 owned by uid 99, got '$mode'"; exit 1; }
          # Security headers on the page and on the API
          curl -sI $B/ | grep -qi '^content-security-policy:' || { echo "::error::CSP header missing"; exit 1; }
          curl -sI -H "X-Settings-Password: $PW" $B/api/settings | grep -qi '^cache-control: no-store' || { echo "::error::no-store missing on API"; exit 1; }
          # Wrong-password throttle kicks in
          for i in $(seq 1 10); do code -H "X-Settings-Password: nope" $B/api/settings >/dev/null; done
          [ "$(code -H "X-Settings-Password: $PW" $B/api/settings)" = 429 ] || { echo "::error::expected 429 after repeated wrong passwords"; exit 1; }
          # ...and the app must NOT be running as root
          # PID 1 is gunicorn (entrypoint exec's setpriv which exec's gunicorn); slim image has no ps
          uid=$(docker exec smoke sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")
          echo "gunicorn runs as uid=$uid"; [ "$uid" = "99" ] || { echo "::error::expected uid 99, got '$uid'"; exit 1; }
          docker logs smoke 2>&1 | grep -qi "traceback" && { echo "::error::Traceback in container log"; docker logs smoke; exit 1; }
          docker rm -f smoke
          # Without a password the settings API must be read-only (403), while the dashboard stays open.
          docker run -d --name smoke2 -p 8687:8686 $HARDEN rsync-dashboard:smoke
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8687/healthz >/dev/null && break; sleep 1; done
          [ "$(code http://127.0.0.1:8687/api/settings)" = 403 ] || { echo "::error::settings without SETTINGS_PASSWORD should be 403"; docker logs smoke2; exit 1; }
          curl -fs http://127.0.0.1:8687/api/dashboard >/dev/null
          docker rm -f smoke2
          echo "Image boots under cap-drop=ALL, drops privileges, protects settings, persists 0600 files."

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping creation."
          else
            # If the tag is annotated, its message becomes the release summary,
            # prepended to the auto-generated notes (commit list).
            NOTES="$(git tag -l --format='%(contents)' "$TAG")"
            gh release create "$TAG" --notes "$NOTES" --generate-notes
          fi
